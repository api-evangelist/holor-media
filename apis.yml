name: Holor Media
description: Holor Media was an integrated immersive media technology company founded
  in 2015 and based in Los Angeles and San Francisco. It focused on 360/VR content
  creation and distribution, building augmented and virtual reality authoring tools
  aimed at the next generation of social, interactive XR (extended reality) experiences,
  including interactive 360 apps for the Transformers film franchise. It raised seed
  funding from 500 Global (formerly 500 Startups), Skyline Ventures, and WI Harper
  Group. The company is now permanently closed and its former domain (holor.com) is
  a parked, for-sale listing on Afternic, so there is no active developer surface,
  API, documentation, or SDK to profile. This record is retained as a historical
  portfolio lead.
